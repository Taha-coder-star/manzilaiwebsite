<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 22 320 142" width="320" height="142" role="img" aria-label="Illustration of an apartment building">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9eddf"/><stop offset="1" stop-color="#f1f7ee"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6f3ea"/><stop offset="1" stop-color="#e8e4d6"/></linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#sky)"/>
  <circle cx="262" cy="36" r="16" fill="#fbfaf5" opacity=".9"/>
  <!-- back building -->
  <rect x="30" y="64" width="62" height="96" fill="#bcd8c6"/>
  <!-- main building -->
  <rect x="96" y="30" width="128" height="130" rx="3" fill="url(#wall)"/>
  <rect x="96" y="30" width="128" height="10" fill="#0f3d2e"/>
  <g fill="#0f3d2e" opacity=".82">
    <rect x="110" y="52" width="20" height="22" rx="2"/><rect x="150" y="52" width="20" height="22" rx="2"/><rect x="190" y="52" width="20" height="22" rx="2"/>
    <rect x="110" y="84" width="20" height="22" rx="2"/><rect x="150" y="84" width="20" height="22" rx="2"/><rect x="190" y="84" width="20" height="22" rx="2"/>
    <rect x="110" y="116" width="20" height="22" rx="2"/><rect x="190" y="116" width="20" height="22" rx="2"/>
  </g>
  <rect x="146" y="116" width="28" height="44" rx="2" fill="#5f9e7f"/>
  <!-- side building -->
  <rect x="228" y="76" width="56" height="84" fill="#cfe6d7"/>
  <g fill="#0f3d2e" opacity=".5"><rect x="238" y="88" width="12" height="14"/><rect x="262" y="88" width="12" height="14"/><rect x="238" y="114" width="12" height="14"/><rect x="262" y="114" width="12" height="14"/></g>
  <g fill="#0f3d2e" opacity=".35"><rect x="40" y="76" width="10" height="12"/><rect x="62" y="76" width="10" height="12"/><rect x="40" y="100" width="10" height="12"/><rect x="62" y="100" width="10" height="12"/></g>
  <!-- ground -->
  <rect y="160" width="320" height="20" fill="#9dc4ab"/>
  <rect y="160" width="320" height="3" fill="#7fae92"/>
</svg>
